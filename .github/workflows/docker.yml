name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Weekly, to pick up Debian security updates between upstream releases.
  schedule:
    - cron: "0 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write   # push to ghcr.io

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: amd64,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build test image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        load: true
        tags: discount-bandit:test
        platforms: linux/amd64

    # The app needs a database to start, so check what the rebuild touches:
    # packages are upgraded, and PHP and Chromium still run.
    - name: Smoke test
      run: |
        docker run --rm --entrypoint sh discount-bandit:test -c '
          set -e
          php --version
          chromium --headless=new --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q "<p>ok</p>"
          test -z "$(apt list --upgradable 2>/dev/null | grep -v "^Listing")"
        '

    # Tag as <upstream tag>-<UTC timestamp>. Publish on push to main, and on scheduled
    # or manual runs only when the package set changed since the last image.
    - name: Decide whether to publish
      id: publish
      run: |
        base="$(sed -n 's/^FROM cybrarist\/discount-bandit:\(.*\)$/\1/p' Dockerfile)"
        packages="$(docker run --rm --entrypoint dpkg-query discount-bandit:test -W | sha256sum | cut -c1-16)"
        echo "base=${base}" >> "$GITHUB_OUTPUT"
        echo "tag=${base}-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
        echo "packages=${packages}" >> "$GITHUB_OUTPUT"

        published="$(docker buildx imagetools inspect "${IMAGE}:latest" \
          --format '{{ json (index .Image "linux/amd64").Config.Labels }}' 2>/dev/null \
          | jq -r '."io.github.casmith.packages" // empty' || true)"
        published_base="$(docker buildx imagetools inspect "${IMAGE}:latest" \
          --format '{{ json (index .Image "linux/amd64").Config.Labels }}' 2>/dev/null \
          | jq -r '."io.github.casmith.base" // empty' || true)"

        enabled=false
        case "${{ github.event_name }}" in
          push) enabled=true ;;
          schedule|workflow_dispatch)
            if [[ "$packages" != "$published" || "$base" != "$published_base" ]]; then enabled=true; fi ;;
        esac
        echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
        echo "base=${base} packages=${packages} published=${published:-none} enabled=${enabled}"

    - name: Login to GHCR
      if: steps.publish.outputs.enabled == 'true'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: ${{ steps.publish.outputs.enabled == 'true' }}
        tags: |
          ${{ env.IMAGE }}:${{ steps.publish.outputs.tag }}
          ${{ env.IMAGE }}:latest
        platforms: linux/amd64,linux/arm64
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          io.github.casmith.base=${{ steps.publish.outputs.base }}
          io.github.casmith.packages=${{ steps.publish.outputs.packages }}
